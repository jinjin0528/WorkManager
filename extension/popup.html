<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 260px;
      padding: 14px;
      font-family: -apple-system, "Malgun Gothic", sans-serif;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
    }
    label {
      font-size: 12px;
      color: #555;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      margin-top: 4px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 6px;
    }
    #saveBtn {
      background: #2563eb;
      color: white;
    }
    #saveBtn:hover {
      background: #1d4ed8;
    }
    #exportBtn {
      background: #16a34a;
      color: white;
    }
    #exportBtn:hover {
      background: #15803d;
    }
    #exportBtn:disabled {
      background: #d1d5db;
      cursor: not-allowed;
    }
    #status {
      margin-top: 4px;
      font-size: 12px;
      color: #16a34a;
      min-height: 14px;
    }
    .cache-box {
      margin-top: 12px;
      padding: 10px;
      background: #f3f4f6;
      border-radius: 6px;
      font-size: 12px;
      color: #374151;
      line-height: 1.5;
    }
    .cache-box .empty {
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <h3>WorkManager 설정</h3>
  <label for="nameInput">담당자 이름</label>
  <input type="text" id="nameInput" placeholder="이름을 입력해주세요." />
  <button id="saveBtn">이름 저장</button>
  <p id="status"></p>

  <div class="cache-box" id="cacheBox">
    <span class="empty">아직 감지된 과제 데이터가 없습니다.</span>
  </div>

  <button id="exportBtn" disabled>과제 목록 내보내기 (JSON)</button>

  <script src="popup.js"></script>
</body>
</html>
